name: CI

# A cancela roda no servidor: o PR de um agente passa pela mesma régua que o de
# um humano (cap. 35 do livro). Verde aqui é pré-requisito de merge em develop/main.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  flutter:
    name: Flutter — format + analyze + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versão fixa (não `channel: stable` solto): o formatter do Dart muda de
      # release e `channel: stable` flutuaria para o Flutter mais novo, quebrando
      # o gate de format a cada release. Casa com o `.puro.json` do repo — os dois
      # precisam andar juntos, senão o dev formata numa versão e a CI cobra outra.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Dependências (pub workspace)
        run: dart pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise estática
        run: flutter analyze

      - name: Gates de qualidade (guard-script)
        run: bash scripts/gates_guard.sh

      - name: Testes — sdui_core (kernel)
        run: dart test packages/sdui_core

      - name: Testes — sdui_flutter (renderer)
        run: flutter test
        working-directory: packages/sdui_flutter

      # Da raiz o bundle de assets não é montado e os goldens rodariam sem
      # fontes nem ícones (`loadAppFonts` falha alto nesse caso).
      - name: Testes — driva_editor (editor)
        run: flutter test
        working-directory: apps/driva_editor

  backend:
    name: Backend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Dependências
        run: pnpm install --frozen-lockfile

      - name: Prisma Client
        run: pnpm prisma:generate

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Build (tsc via nest)
        run: pnpm build
