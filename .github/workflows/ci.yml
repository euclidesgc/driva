name: CI

# A cancela roda no servidor: o PR de um agente passa pela mesma régua que o de
# um humano (cap. 35 do livro). Verde aqui é pré-requisito de merge em develop/main.
on:
  # PR empilhado (stacked PR) aponta para a branch de suporte de baixo, não para
  # develop — sem `feature/**` e amigos aqui, só o PR do fundo da pilha via a
  # régua, e os do meio passavam com GitGuardian sozinho. Aconteceu no item 38:
  # a F5 subiu para homologação com o job de format vermelho, porque o
  # auto-deploy do Coolify dispara no push sem consultar o CI.
  #
  # `docs/**` entrou depois, e pelo mesmo buraco: no item 41 a pilha nasceu
  # sobre uma branch de docs, e o PR #141 passou de novo só com o GitGuardian.
  # A lista precisa cobrir todo prefixo que pode virar base de pilha, não só os
  # do GitFlow.
  pull_request:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'
      - 'docs/**'
  push:
    branches: [develop, main]

# Nenhum job usa segredo guardado (a sintaxe `secrets`), e o job de Android
# baixa e executa código de plugin de terceiros (AGP, Kotlin, o loader do
# Flutter) — sem isto, esse código roda com o `GITHUB_TOKEN` no default do
# repositório, que pode ser read/write. Só o job `publish-demo-apk` escreve no
# repositório (ele publica o APK de homologação no release
# `demo-app-latest`), e escopa a permissão extra localmente com seu próprio
# bloco `permissions:` — o token que ele usa é o automático do Actions
# (`github.token`), não um segredo guardado.
permissions:
  contents: read

# Versão fixa (não `channel: stable` solto): o formatter do Dart muda de release
# e `channel: stable` flutuaria para o Flutter mais novo, quebrando o gate de
# format a cada release. Casa com o `.puro.json` do repo — os dois precisam andar
# juntos, senão o dev formata numa versão e a CI cobra outra. Aqui em cima porque
# mais de um job a consome, e uma CI que builda o app numa versão e analisa noutra
# não prova nada. Entre aspas porque uma versão de dois componentes (`3.50`) seria
# lida como float e instalaria `3.5` sem dizer nada.
env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  flutter:
    name: Flutter — format + analyze + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências (pub workspace)
        run: dart pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise estática
        run: flutter analyze

      - name: Gates de qualidade (guard-script)
        run: bash scripts/gates_guard.sh

      - name: Testes — sdui_core (kernel)
        run: dart test packages/sdui_core

      - name: Testes — sdui_flutter (renderer)
        run: flutter test
        working-directory: packages/sdui_flutter

      - name: Testes — driva_client (runtime do app cliente)
        run: flutter test
        working-directory: packages/driva_client

      # Da raiz o bundle de assets não é montado e os goldens rodariam sem
      # fontes nem ícones (`loadAppFonts` falha alto nesse caso).
      - name: Testes — driva_editor (editor)
        run: flutter test
        working-directory: apps/driva_editor

      - name: Testes — driva_demo_app (app de consumo)
        run: flutter test
        working-directory: apps/driva_demo_app

  android:
    # `flutter analyze` e `flutter test` nunca saem do Dart: a configuração do
    # Gradle, o merge de manifests e o template Android inteiro passavam por fora
    # da cancela. Dois defeitos reais viveram nesse ponto cego (item 25 e o AGP
    # 9.0.1 que exige o tooling do Flutter 3.44.9) — nenhum dos dois é visível
    # sem chamar o Gradle de verdade.
    #
    # `--debug` e não `--release`: a regressão de toolchain morre na fase de
    # configuração do Gradle, antes de compilar qualquer coisa, e ali os dois
    # modos são idênticos — o release só somaria AOT por ABI para reprovar no
    # mesmo ponto (tarefa do Gradle medida na mesma máquina, as duas a quente:
    # 41,7s de `assembleDebug` contra 86,8s de `assembleRelease`). Assinatura não
    # entra na conta: o buildType de release usa a chave de debug de propósito
    # (`app/build.gradle.kts`), não há keystore nem segredo em nenhum dos dois.
    #
    # O que este job NÃO cobre: (a) a permissão de internet — o template injeta
    # `INTERNET` no manifest de debug, então nenhum build de debug reprovaria por
    # falta dela; quem guarda é o `test/android_manifest_test.dart`, no job acima;
    # (b) o que só o release exercita — AOT (`gen_snapshot`) e o tree-shake de
    # ícones, o mesmo que já produziu "tofu" em produção no bundle web do editor
    # (por isso o `apps/driva_editor/Dockerfile` builda com
    # `--no-tree-shake-icons`). Hoje nada no app, no renderer ou no kernel
    # constrói `IconData` dinamicamente, então (b) é buraco teórico — mas é buraco.
    #
    # Sem filtro de path de propósito: o app está no pub workspace e é o primeiro
    # consumidor externo do renderer, então mudança em `packages/sdui_flutter`,
    # no `pubspec.yaml` da raiz ou na versão do Flutter aqui do workflow também
    # quebra este build. Um filtro correto acabaria disparando em quase todo PR;
    # o `needs` abaixo é que evita gastar os minutos do Android quando o Dart já
    # está vermelho.
    name: Android — build do app de demonstração
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/driva_demo_app/android/**/*.gradle*
            apps/driva_demo_app/android/**/gradle.properties
            apps/driva_demo_app/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências (pub workspace)
        run: dart pub get

      # `main.dart` não existe: o app é por flavor. `main_dev.dart` compila a
      # mesma árvore que `main_hml.dart` e não pede nenhum dart-define — os
      # valores têm default e só importam em runtime.
      - name: Build APK debug
        run: flutter build apk --debug --target lib/main_dev.dart
        working-directory: apps/driva_demo_app

  backend:
    name: Backend — build + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Dependências
        run: pnpm install --frozen-lockfile

      - name: Prisma Client
        run: pnpm prisma:generate

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Build (tsc via nest)
        run: pnpm build

      - name: Testes unitários
        run: pnpm test

      # A suíte de segurança do proxy de mídia (docs/16-image-url-e-props
      # §11.4) depende de um default do runtime (`autoSelectFamily`/Happy
      # Eyeballs) que muda entre versões do Node — rodar fora do Node 22
      # (a mesma versão do `Dockerfile` de produção, linha acima) validaria
      # outro runtime, não o que serve o proxy de verdade. Custo ~17-20s,
      # dominado pelo teste de timeout (#38); as deps já vieram do
      # `pnpm install --frozen-lockfile`.
      - name: Testes e2e (proxy de mídia — matriz de segurança SSRF)
        run: pnpm test:e2e

  publish-demo-apk:
    name: APK de demonstração — publica no tag demo-app-latest
    needs: flutter
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    concurrency:
      group: publish-demo-apk
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/driva_demo_app/android/**/*.gradle*
            apps/driva_demo_app/android/**/gradle.properties
            apps/driva_demo_app/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências (pub workspace)
        run: dart pub get

      - name: Build APK release (chave e conteúdo resolvidos na API de homologação)
        working-directory: apps/driva_demo_app
        env:
          MODE: apk
          TARGET: lib/main_hml.dart
          API: https://api-hml.driva.duckdns.org
          PROJECT_TITLE: ${{ vars.DEMO_PROJECT_TITLE }}
          SLUG: ${{ vars.DEMO_SLUG }}
        run: |
          ./tool/run_demo.sh
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/driva-demo-hml.apk

      - name: Publica no tag fixo demo-app-latest
        working-directory: apps/driva_demo_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view demo-app-latest >/dev/null 2>&1 || \
            gh release create demo-app-latest \
              --target "$GITHUB_SHA" --prerelease \
              --title 'App de demonstração (homologação)' \
              --notes 'Asset rolante: sempre o último build de develop.'
          gh release upload demo-app-latest \
            build/app/outputs/flutter-apk/driva-demo-hml.apk --clobber
          gh release edit demo-app-latest \
            --notes "Build de homologação · commit $GITHUB_SHA · $(date -u '+%Y-%m-%d %H:%M UTC')"
