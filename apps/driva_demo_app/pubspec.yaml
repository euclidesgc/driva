name: driva_demo_app
description: App de demonstração do driva — consome specs SDUI publicados pela API e renderiza com o sdui_flutter, como fará o app de um cliente.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  bloc: ^9.2.1
  driva_client: ^0.2.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.1.0
  sdui_core: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.6.0

flutter:
  uses-material-design: true
