name: driva_demo_app
description: App de demonstração do driva — consome specs SDUI publicados pela API e renderiza com o sdui_flutter, como fará o app de um cliente.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  bloc: ^9.0.0
  driva_client: ^0.2.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  go_router: ^16.0.0
  sdui_core: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
