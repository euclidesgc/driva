name: driva_editor
description: Editor web do driva — monta páginas Server-Driven UI como spec JSON, com preview fiel via sdui_flutter.
publish_to: none
version: 0.4.0
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  bloc: ^9.2.1
  dio: ^5.11.1
  equatable: ^3.0.0
  # v4 depends on material_ui, whose MaterialLocalizations are incompatible
  # with Flutter's MaterialApp. Keep the newest compatible major.
  flex_color_picker: ^3.8.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_web_plugins:
    sdk: flutter
  fpdart: ^1.2.0
  get_it: ^9.3.0
  go_router: ^18.1.0
  qr_flutter: ^4.1.0
  sdui_core: ^0.3.2
  sdui_flutter: ^0.4.0
  shared_preferences: ^2.5.6
  web: ^1.1.1
  zard: ^1.4.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: Public Sans
      fonts:
        - asset: fonts/public_sans/PublicSans-Regular.ttf
        - asset: fonts/public_sans/PublicSans-Medium.ttf
          weight: 500
        - asset: fonts/public_sans/PublicSans-SemiBold.ttf
          weight: 600
        - asset: fonts/public_sans/PublicSans-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: fonts/space_grotesk/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: fonts/space_grotesk/SpaceGrotesk-Bold.ttf
          weight: 700
