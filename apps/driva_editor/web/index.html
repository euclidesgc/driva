<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Driva Builder — monte as telas do seu aplicativo no navegador e veja o resultado no celular.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Driva Builder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Driva Builder</title>
  <script>
    /* O <link rel="manifest"> é criado aqui em vez de estar estático no HTML
       com o href trocado depois: o Chrome começa a processar o link no instante
       em que o parser o insere, e a troca por script chegava tarde. Quem
       instalava a partir de /preview levava o alvo do editor (scope "/"), que
       captura todos os links do editor no aparelho — o oposto do que a D31
       desenhou, e sem sintoma visível, porque a barra de endereços some nos
       dois casos. Sem link estático não existe corrida.

       O iOS ignora o manifest ao adicionar à tela inicial e usa o title e o
       apple-mobile-web-app-title; sem trocá-los, os dois ícones ficariam com o
       mesmo nome no iPhone. */
    (function () {
      var isPreview = location.pathname.startsWith('/preview');
      var manifest = document.createElement('link');
      manifest.rel = 'manifest';
      manifest.href = isPreview ? 'preview_manifest.json' : 'manifest.json';
      document.head.appendChild(manifest);
      if (isPreview) {
        document.title = 'Driva Preview';
        document
          .querySelector('meta[name="apple-mobile-web-app-title"]')
          .setAttribute('content', 'Driva Preview');
      }
    })();
  </script>

  <style>
    /* Sem isto, puxar no Chrome Android dispara dois refreshes: o
       RefreshIndicator do Flutter (F2b, item 41) e o reload nativo da aba,
       que derruba o app e refaz a carga do zero. */
    html, body {
      overscroll-behavior-y: contain;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
