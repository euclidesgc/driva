<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Driva Builder — monte as telas do seu aplicativo no navegador e veja o resultado no celular.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Driva Builder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Driva Builder</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if (location.pathname.startsWith('/preview')) {
      document
        .querySelector('link[rel="manifest"]')
        .setAttribute('href', 'preview_manifest.json');
      /* O iOS ignora o manifest ao adicionar à tela inicial e usa estes dois.
         Sem trocá-los, o preview instalado no iPhone se chamaria como o app
         inteiro, e os dois ícones ficariam indistinguíveis lado a lado. */
      document.title = 'Driva Preview';
      document
        .querySelector('meta[name="apple-mobile-web-app-title"]')
        .setAttribute('content', 'Driva Preview');
    }
  </script>

  <style>
    /* Sem isto, puxar no Chrome Android dispara dois refreshes: o
       RefreshIndicator do Flutter (F2b, item 41) e o reload nativo da aba,
       que derruba o app e refaz a carga do zero. */
    html, body {
      overscroll-behavior-y: contain;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
